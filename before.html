<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>before</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #d8b4fe;
      font-family: sans-serif;
      font-weight: 700;
      overflow: hidden;
    }

    .paths {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8vw;
      min-height: 100%;
      padding: 12vh 8vw 4vh;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    body.revealed .paths {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .choice {
      display: block;
      color: #d8b4fe;
      font: inherit;
      font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: clamp(1.1rem, 2vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-align: center;
      text-transform: lowercase;
      padding: 0.4rem 0.7rem;
      transition: transform 0.2s ease, filter 0.2s ease, text-shadow 0.2s ease;
      animation: float 3.2s ease-in-out infinite;
      overflow-wrap: anywhere;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(216, 180, 254, 0.8), 0 0 18px rgba(167, 139, 250, 0.45);
      filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.35));
    }

    .choice:hover,
    .choice:focus-visible {
      filter: brightness(1.2) drop-shadow(0 0 14px rgba(216, 180, 254, 0.7));
      outline: none;
    }

    .choice-one {
      animation-delay: 0.4s;
    }

    .choice-two {
      color: #a78bfa;
      animation-delay: 1.2s;
      text-shadow: 0 0 8px rgba(167, 139, 250, 0.85), 0 0 20px rgba(167, 139, 250, 0.55);
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-18px);
      }
    }

    .cover {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2rem;
      background: #000;
      color: #d8b4fe;
      font-size: clamp(1.5rem, 4vw, 4rem);
      text-align: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .cover.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .paths {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 3rem;
        padding: 8vh 8vw;
      }

      .choice {
        align-self: flex-end;
        max-width: 85%;
        font-size: clamp(1rem, 4vw, 1.7rem);
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <div id="cover" class="cover" role="button" tabindex="0" aria-label="Reveal the two paths">
    Now you have two paths to follow.
  </div>

  <main class="paths" aria-live="polite">
    <div class="choice choice-one" aria-label="Path one">🔁._._/nircimb/</div>
    <div class="choice choice-two" aria-label="Path two">_._._/orzhupbhbhv/</div>
  </main>

  <script>
    const cover = document.getElementById('cover');

    function revealChoices() {
      document.body.classList.add('revealed');
      cover.classList.add('hidden');
    }

    cover.addEventListener('click', revealChoices);
    cover.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        revealChoices();
      }
    });
  </script>
</body>
</html>
