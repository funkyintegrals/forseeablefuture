<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>before</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #d8b4fe;
      font-family: sans-serif;
      font-weight: 700;
      overflow: hidden;
    }

    .paths {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8vw;
      min-height: 100%;
      padding: 12vh 8vw 4vh;
    }

    .cipher1,
    .cipher2 {
      flex: 1 1 0;
      min-width: 0;
    }

    .cipher1 {
      align-self: center;
      transform: translateY(8vh);
      font-size: clamp(2.5rem, 7vw, 7rem);
      overflow-wrap: anywhere;
    }

    .cipher2 {
      color: #a78bfa;
      font-size: clamp(1.25rem, 2.5vw, 2.5rem);
      line-height: 1.4;
      font-weight: 400;
    }

    body::after {
      content: "Now you have two paths to follow.";
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2rem;
      background: #000;
      color: #d8b4fe;
      font-size: clamp(1.5rem, 4vw, 4rem);
      text-align: center;
      pointer-events: none;
      animation: reveal 3s ease-out forwards;
    }

    @keyframes reveal {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @media (max-width: 700px) {
      .paths {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 3rem;
        padding: 8vh 8vw;
      }

      .cipher1 {
        transform: translateY(3vh);
      }

      .cipher2 {
        align-self: flex-end;
        max-width: 85%;
        text-align: right;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after {
        animation-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>
  <main class="paths">
    <div class="cipher1">🔁._._/nircimb/</div>
    <div class="cipher2">_._._/orzhupbhbhv/</div>
  </main>
</body>
</html>
