<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>before</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #d8b4fe;
      font-family: sans-serif;
      font-weight: 700;
      overflow: hidden;
    }

    .cover {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: #f1f1f1;
      animation: cover-fade 2.8s ease-in forwards;
    }

    .paths {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
      padding: clamp(1.2rem, 8vh, 5rem) clamp(1rem, 8vw, 8rem) clamp(1.2rem, 8vh, 5rem);
    }

    .choice {
      display: block;
      max-width: min(92vw, 1200px);
      margin: 0 auto;
      color: #d8b4fe;
      font: inherit;
      font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: clamp(0.72rem, min(2vw, 3.8vh), 2.2rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-align: center;
      text-transform: lowercase;
      padding: 0.4rem 0.7rem;
      text-shadow: 0 0 8px rgba(216, 180, 254, 0.8), 0 0 18px rgba(167, 139, 250, 0.45);
      filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.35));
      white-space: nowrap;
      overflow-wrap: anywhere;
    }

    .choice-one {
      color: #d8b4fe;
    }

    .choice-two {
      color: #a78bfa;
      text-shadow: 0 0 8px rgba(167, 139, 250, 0.85), 0 0 20px rgba(167, 139, 250, 0.55);
    }

    @keyframes cover-fade {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @media (max-width: 700px) {
      .paths {
        padding-inline: 5vw;
      }

      .choice {
        max-width: 92vw;
        white-space: normal;
        font-size: clamp(0.7rem, min(4vw, 3.2vh), 1.7rem);
      }
    }
  </style>
</head>

<body>
  <div class="cover" aria-hidden="true"></div>

  <main class="paths" aria-label="Two paths">
    <div class="choice choice-one" aria-label="Path one">Path one: [msbsiqzidsj]-beta.vercel.app/</div>
    <div class="choice choice-two" aria-label="Path two">Path two: [kvwtsqiqlpvycol: key 2].vercel.app</div>
  </main>
</body>
</html>
