<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>before</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #d8b4fe;
      font-family: sans-serif;
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 700;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #000;
      pointer-events: none;
      animation: reveal 3s ease-out forwards;
    }

    @keyframes reveal {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after {
        animation-duration: 0.01ms;
      }
    }
  </style>
</head>

</body>
</html>
