<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>before</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #f1f1f1;
      color: #d8b4fe;
      font-family: sans-serif;
      font-weight: 700;
      overflow: hidden;
    }

    .paths {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8vw;
      min-height: 100%;
      padding: 12vh 8vw 4vh;
    }

    .choice {
      --rest-offset: 0px;
      display: block;
      color: #d8b4fe;
      font: inherit;
      font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: clamp(1.1rem, 2vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-align: center;
      text-transform: lowercase;
      padding: 0.4rem 0.7rem;
      transition: filter 0.2s ease, text-shadow 0.2s ease;
      animation: float 3.2s ease-in-out infinite;
      overflow-wrap: anywhere;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(216, 180, 254, 0.8), 0 0 18px rgba(167, 139, 250, 0.45);
      filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.35));
    }

    .choice:hover,
    .choice:focus-visible {
      filter: brightness(1.2) drop-shadow(0 0 14px rgba(216, 180, 254, 0.7));
      outline: none;
    }

    .choice-one {
      --rest-offset: -20px;
      animation-delay: 0.4s;
    }

    .choice-two {
      --rest-offset: 20px;
      color: #a78bfa;
      animation-delay: 1.2s;
      text-shadow: 0 0 8px rgba(167, 139, 250, 0.85), 0 0 20px rgba(167, 139, 250, 0.55);
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(var(--rest-offset));
      }
      50% {
        transform: translateY(calc(var(--rest-offset) - 18px));
      }
    }

    @media (max-width: 700px) {
      .paths {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 3rem;
        padding: 8vh 8vw;
      }

      .choice {
        align-self: flex-end;
        max-width: 85%;
        font-size: clamp(1rem, 4vw, 1.7rem);
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <main class="paths" aria-label="Two paths">
    <div class="choice choice-one" aria-label="Path one">Path one: [msbsiqzidsj]-beta.vercel.app/</div>
    <div class="choice choice-two" aria-label="Path two">Path two: recallofarchive.vercel.app</div>
  </main>
</body>
</html>
